<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appshot Editor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◧</span> Appshot <span id="appName" class="app"></span></div>
  <div class="controls">
    <select id="size" title="Canvas size"></select>
    <select id="locale" title="Locale"></select>
    <span id="dirty" class="dirty" hidden>● unsaved</span>
    <button id="save" class="primary">Save</button>
    <button id="draft">Render drafts</button>
    <button id="final">Render final</button>
    <button id="score">Score</button>
  </div>
</header>
<div id="banner" class="banner" hidden>plan.json changed on disk (the agent edited it). <button id="reload">Reload</button> <button id="keep">Keep mine</button></div>
<section class="strip-wrap">
  <div id="strip" class="strip"><iframe id="stripFrame" title="All screenshots"></iframe><div id="stripHits" class="hits"></div></div>
</section>
<main class="main">
  <section class="stage"><div id="stage" class="stage-inner"><iframe id="shotFrame" title="Selected screenshot"></iframe></div></section>
  <aside class="inspector">
    <nav class="tabs"><button data-tab="shot" class="on">Shot</button><button data-tab="set">Set</button><button data-tab="issues">Issues <span id="issueCount" class="badge"></span></button><button data-tab="design">Directions</button></nav>
    <div id="tab-shot" class="tab-body"></div>
    <div id="tab-set" class="tab-body" hidden></div>
    <div id="tab-issues" class="tab-body" hidden></div>
    <div id="tab-design" class="tab-body" hidden></div>
  </aside>
</main>
<footer class="log"><pre id="log"></pre></footer>
<script src="/app.js" type="module"></script>
</body>
</html>
