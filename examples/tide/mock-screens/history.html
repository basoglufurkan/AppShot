<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_tide.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:12px">
  <div class="h1">History</div>
  <div class="card row" style="margin-top:16px;gap:16px;padding:18px 20px;background:linear-gradient(135deg,#FFF4EA,#FFE6D2)">
    <div style="font-size:44px">🔥</div>
    <div><div style="font-size:30px;font-weight:900;letter-spacing:-.8px">14-day streak</div><div style="font-size:14px;font-weight:600;color:#B5651D">Goal hit every day for two weeks</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><div style="font-weight:800;font-size:17px">Last 7 days</div><div class="muted" style="font-size:13px;font-weight:600">Goal 2,500 ml</div></div>
    <div style="position:relative;height:210px;margin-top:14px">
      
      <div style="position:absolute;left:0;right:0;top:46px;border-top:2px dashed #9FC4EE"></div>
      <div class="row" style="position:absolute;left:0;right:0;bottom:0;height:100%;align-items:flex-end;justify-content:space-between;gap:10px">
        <script>document.write([['F',2520],['S',2800],['S',2600],['M',2550],['T',2640],['W',2700],['T',1650]].map(([d,v],i)=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(v/2800*175)}px;border-radius:10px;background:${i===6?'linear-gradient(180deg,#9EDCF5,#5FB0F5)':'linear-gradient(180deg,#5FD3F3,#1E7BF0)'}"></div><div class="muted" style="font-size:12px;font-weight:700;margin-top:6px">${d}</div></div>`).join(''))</script>
      </div>
    </div>
  </div>
  <div class="row" style="gap:12px;margin-top:12px">
    <div class="card" style="flex:1"><div class="muted" style="font-size:13px;font-weight:600">Daily average</div><div style="font-size:28px;font-weight:900;margin-top:4px">2,630 ml</div><div style="font-size:13px;color:#16A34A;font-weight:700">105% of goal</div></div>
    <div class="card" style="flex:1"><div class="muted" style="font-size:13px;font-weight:600">Goal hit</div><div style="font-size:28px;font-weight:900;margin-top:4px">14 / 14</div><div style="font-size:13px;color:var(--accent);font-weight:700">days</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div style="font-weight:800;font-size:17px">What you drink</div>
    <div class="row" style="height:14px;border-radius:7px;overflow:hidden;margin-top:12px"><div style="width:78%;height:100%;background:#1E7BF0"></div><div style="width:14%;height:100%;background:#22C3E6"></div><div style="width:8%;height:100%;background:#A7D8F5"></div></div>
    <div class="row" style="gap:16px;margin-top:10px;font-size:13px;font-weight:700"><span>💧 Water 78%</span><span>🍵 Tea 14%</span><span>🫧 Sparkling 8%</span></div>
  </div>
</div>
<div class="tabbar"><div class="tab"><i style="border-radius:50%"></i>Today</div><div class="tab on"><i></i>History</div><div class="tab"><i style="border-radius:4px"></i>Reminders</div><div class="tab"><i style="border-radius:50%"></i>Profile</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
