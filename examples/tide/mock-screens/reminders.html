<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_tide.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:12px">
  <div class="row" style="justify-content:space-between"><div class="h1">Reminders</div><div class="toggle"></div></div>
  <div class="muted" style="font-size:15px;margin-top:4px">Gentle nudges from morning to night</div>
  <div class="card" style="margin-top:16px;padding:6px 18px">
    <div class="row" style="justify-content:space-between;padding:12px 0"><span style="font-weight:700;font-size:16px">From</span><span class="chip" style="background:#E7F1FC;color:var(--deep);font-size:15px">08:00</span></div>
    <div class="row" style="justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)"><span style="font-weight:700;font-size:16px">Until</span><span class="chip" style="background:#E7F1FC;color:var(--deep);font-size:15px">22:00</span></div>
  </div>
  <div class="lbl">REMIND ME EVERY</div>
  <div class="row" style="gap:8px"><script>document.write(['60 min','90 min','2 hours','Smart'].map((t,i)=>`<span class="chip" style="font-size:15px;padding:10px 16px;${i===1?'background:var(--fg);color:#fff':'background:#fff;color:var(--fg);box-shadow:inset 0 0 0 1.5px #D6E2EF'}">${t}</span>`).join(''))</script></div>
  <div class="card row" style="margin-top:16px;gap:14px;padding:16px 18px"><div style="font-size:24px">🌊</div><div style="flex:1"><div style="font-weight:700;font-size:16px">Smart pause</div><div class="muted" style="font-size:13px;margin-top:2px">Skip a reminder when you're ahead of your goal</div></div><div class="toggle"></div></div>
  <div class="lbl">TODAY</div>
  <div class="card" style="padding:14px 18px">
    <script>document.write(['08:00','09:30','11:00','12:30','14:00','15:30','17:00','18:30','20:00'].map((t,i)=>`<div class="row" style="gap:12px;padding:5px 0"><div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;${i<6?'background:var(--accent);color:#fff':i===6?'box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--accent)':'box-shadow:inset 0 0 0 2px #D6E2EF'}">${i<6?'✓':''}</div><div style="flex:1;font-weight:700;font-size:15px;${i>6?'color:var(--muted)':''}">${t}</div>${i===6?'<span class="chip" style="background:#E7F1FC;color:var(--accent)">Next</span>':''}${i<6?'<span class="muted" style="font-size:13px;font-weight:600">logged</span>':''}</div>`).join(''))</script>
  </div>
</div>
<div class="tabbar"><div class="tab"><i style="border-radius:50%"></i>Today</div><div class="tab"><i></i>History</div><div class="tab on"><i style="border-radius:4px"></i>Reminders</div><div class="tab"><i style="border-radius:50%"></i>Profile</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
