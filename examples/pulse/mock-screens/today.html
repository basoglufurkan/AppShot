<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_pulse.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:14px">
  <div class="row" style="justify-content:space-between">
    <div><div class="muted" style="font-size:15px;font-weight:600">Tuesday, 14 May</div><div class="h1" style="margin-top:2px">Good morning, Alex</div></div>
    <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#8B7CFF,#C6F432)"></div>
  </div>
  <div class="row" style="gap:10px;margin-top:16px">
    <span class="pill" style="background:rgba(255,138,61,.16);color:#FF8A3D">🔥 12-day streak</span>
    <span class="pill" style="background:rgba(198,244,50,.12);color:var(--accent)">Level 7</span>
  </div>
  <div class="card" style="margin-top:20px;padding:0;overflow:hidden;background:linear-gradient(160deg,#2A2550 0%,#17191F 70%)">
    <div style="height:190px;position:relative;background:radial-gradient(circle at 75% 35%,rgba(198,244,50,.55),transparent 45%),radial-gradient(circle at 20% 80%,rgba(139,124,255,.6),transparent 50%)">
      <div style="position:absolute;left:18px;top:16px" class="pill"><span style="background:rgba(0,0,0,.35);padding:5px 10px;border-radius:99px;color:#fff;font-size:13px">TODAY · AI PLAN</span></div>
      <svg style="position:absolute;right:26px;bottom:18px" width="150" height="120" viewBox="0 0 150 120"><path d="M8 88 L38 88 L52 40 L70 104 L86 20 L102 88 L142 88" stroke="#C6F432" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="padding:18px">
      <div class="h2">Full-Body Burn</div>
      <div class="muted" style="margin-top:4px;font-size:15px">25 min · 8 exercises · No equipment</div>
      <div class="btn" style="margin-top:16px">Start workout</div>
    </div>
  </div>
  <div class="h2" style="margin-top:24px;font-size:20px">This week</div>
  <div class="card row" style="margin-top:12px;justify-content:space-between;padding:16px 18px">
    <script>document.write(['M','T','W','T','F','S','S'].map((d,i)=>`<div style="text-align:center"><div style="width:38px;height:38px;border-radius:50%;margin:0 auto;border:4px solid ${i<2?'#C6F432':i===2?'rgba(198,244,50,.35)':'rgba(255,255,255,.1)'};${i<2?'background:rgba(198,244,50,.15)':''}"></div><div class="muted" style="font-size:12px;margin-top:6px;font-weight:600">${d}</div></div>`).join(''))</script>
  </div>
  <div class="row" style="gap:12px;margin-top:12px">
    <div class="card" style="flex:1"><div class="muted" style="font-size:13px;font-weight:600">Calories</div><div style="font-size:28px;font-weight:800;margin-top:4px">1,284</div><div style="font-size:13px;color:#C6F432;font-weight:700">+12% vs last week</div></div>
    <div class="card" style="flex:1"><div class="muted" style="font-size:13px;font-weight:600">Active minutes</div><div style="font-size:28px;font-weight:800;margin-top:4px">96</div><div style="font-size:13px;color:#8B7CFF;font-weight:700">Goal 150</div></div>
  </div>
</div>
<div class="tabbar"><div class="tab on"><i style="border-radius:50%"></i>Today</div><div class="tab"><i></i>Plans</div><div class="tab"><i style="border-radius:4px"></i>Progress</div><div class="tab"><i style="border-radius:50%"></i>Coach</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
