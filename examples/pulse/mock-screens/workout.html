<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_pulse.css">
<body style="position:relative;background:#0D0E12">
<div class="status"></div>
<div class="px row" style="justify-content:space-between;margin-top:8px">

</div>
<div class="px" style="margin-top:14px"><div style="height:6px;border-radius:3px;background:rgba(255,255,255,.1)"><div style="width:34%;height:100%;border-radius:3px;background:var(--accent)"></div></div></div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">

    <div style="font-size:92px;font-weight:800;letter-spacing:-3px;line-height:1">12<span style="font-size:40px;color:var(--muted)">/15</span></div>
    <div style="font-size:17px;font-weight:700;color:var(--accent);margin-top:6px">00:32</div>
  </div>
</div>
<div style="text-align:center;margin-top:22px"><div class="h1" style="font-size:32px">Jump Squats</div><div class="muted" style="font-size:16px;margin-top:6px">Keep your chest up · land softly</div></div>
<div class="px" style="margin-top:22px">

  </div>

    <div style="flex:1"><div class="muted" style="font-size:13px;font-weight:700">NEXT</div><div style="font-size:17px;font-weight:700;margin-top:3px">Push-ups · 12 reps</div></div>
    <div class="muted" style="font-size:15px;font-weight:600">in 0:20</div>
  </div>

<div class="row" style="position:absolute;bottom:56px;left:0;right:0;justify-content:center;gap:28px">
