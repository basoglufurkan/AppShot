<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_pulse.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:14px">
  <div class="h1">Progress</div>
  <div class="row" style="gap:8px;margin-top:14px">
    <span class="pill" style="background:var(--fg);color:#0D0E12">Week</span><span class="pill" style="background:var(--card);color:var(--muted)">Month</span><span class="pill" style="background:var(--card);color:var(--muted)">Year</span>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><div><div class="muted" style="font-size:13px;font-weight:700">STRENGTH SCORE</div><div style="font-size:40px;font-weight:800;letter-spacing:-1px">742 <span style="font-size:17px;color:var(--accent)">▲ 18%</span></div></div><div class="pill" style="background:rgba(198,244,50,.12);color:var(--accent)">New PR</div></div>
    <div class="row" style="align-items:flex-end;gap:12px;height:150px;margin-top:14px">
      <script>document.write([42,55,48,70,62,84,96].map((h,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div class="bar" style="width:100%;height:${h*1.3}px;${i<6?'background:rgba(198,244,50,.3)':''}"></div><div class="muted" style="font-size:12px;font-weight:600">${'MTWTFSS'[i]}</div></div>`).join(''))</script>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><div class="muted" style="font-size:13px;font-weight:700">BODY WEIGHT</div><div style="font-size:13px;color:var(--violet);font-weight:700">−3.4 kg in 8 weeks</div></div>
    <svg width="360" height="110" viewBox="0 0 360 110" style="margin-top:10px"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".45"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></linearGradient></defs><path d="M0 20 C40 26 60 30 90 38 S150 52 180 58 S240 70 270 78 S330 88 360 92 L360 110 L0 110Z" fill="url(#g)"/><path d="M0 20 C40 26 60 30 90 38 S150 52 180 58 S240 70 270 78 S330 88 360 92" stroke="#8B7CFF" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="360" cy="92" r="6" fill="#8B7CFF"/></svg>
  </div>
  <div class="h2" style="margin-top:22px;font-size:20px">Personal records</div>
  <script>document.write([['🏋️','Squat','80 kg','+5 kg'],['💪','Push-ups','42 reps','+8'],['🏃','Plank','3:10','+0:40']].map(r=>`<div class="card row" style="gap:14px;margin-top:10px;padding:14px 16px"><div style="width:44px;height:44px;border-radius:12px;background:#22252D;display:flex;align-items:center;justify-content:center;font-size:22px">${r[0]}</div><div style="flex:1;font-weight:700;font-size:17px">${r[1]}</div><div style="text-align:right"><div style="font-weight:800;font-size:17px">${r[2]}</div><div style="font-size:13px;color:var(--accent);font-weight:700">${r[3]}</div></div></div>`).join(''))</script>
</div>
<div class="tabbar"><div class="tab"><i style="border-radius:50%"></i>Today</div><div class="tab"><i></i>Plans</div><div class="tab on"><i style="border-radius:4px"></i>Progress</div><div class="tab"><i style="border-radius:50%"></i>Coach</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
