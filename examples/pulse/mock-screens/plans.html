<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_pulse.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:14px">
  <div class="h1">Plans</div>
  <div class="card row" style="margin-top:14px;padding:12px 16px;gap:10px;border-radius:14px"><span class="muted">⌕</span><span class="muted" style="font-size:16px">Search 400+ workouts</span></div>
  <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">
    <span class="pill" style="background:var(--accent);color:#0D0E12">All</span><span class="pill" style="background:var(--card);color:var(--fg)">No equipment</span><span class="pill" style="background:var(--card);color:var(--fg)">15 min</span><span class="pill" style="background:var(--card);color:var(--fg)">Beginner</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
    <script>document.write([['Fat Burn','4 weeks · 20 min','#FF8A3D','🔥'],['Strength','6 weeks · 35 min','#8B7CFF','🏋️'],['Mobility','2 weeks · 12 min','#3DD6C6','🧘'],['Core','3 weeks · 15 min','#C6F432','⚡'],['Run Ready','5 weeks · 25 min','#FF5C8A','🏃'],['Desk Reset','Daily · 8 min','#4CC9F0','🪑']].map(p=>`<div style="border-radius:20px;padding:16px;height:168px;position:relative;overflow:hidden;background:linear-gradient(160deg,${p[2]}55,#17191F 75%)"><div style="font-size:34px">${p[3]}</div><div style="position:absolute;left:16px;bottom:16px"><div style="font-size:19px;font-weight:800">${p[0]}</div><div class="muted" style="font-size:13px;margin-top:3px;font-weight:600">${p[1]}</div></div></div>`).join(''))</script>
  </div>
</div>
<div class="tabbar"><div class="tab"><i style="border-radius:50%"></i>Today</div><div class="tab on"><i></i>Plans</div><div class="tab"><i style="border-radius:4px"></i>Progress</div><div class="tab"><i style="border-radius:50%"></i>Coach</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
