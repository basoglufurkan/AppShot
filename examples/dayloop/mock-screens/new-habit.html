<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_dayloop.css">
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:10px">
  <div class="row" style="justify-content:space-between;font-size:17px;font-weight:600"><span class="muted">Cancel</span><span style="font-weight:800">New habit</span><span style="color:var(--accent);font-weight:800">Save</span></div>
  <div class="card row" style="margin-top:18px;gap:12px;padding:14px 16px"><div class="tile" style="background:#EEE9FF">📚</div><div style="font-size:19px;font-weight:700">Read 10 pages</div><div style="width:2px;height:24px;background:var(--accent);margin-left:-8px"></div></div>
  <div style="font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:20px 4px 10px">ICON</div>
  <div class="card" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px">
    <script>document.write(['📚','🚶','🧘','💧','📵','✍️','🏋️','🥗','😴','🎸','🌱','💊'].map((e,i)=>`<div style="height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;background:${i===0?'#EEE9FF':'#F5F3F0'};${i===0?'box-shadow:inset 0 0 0 2.5px #7C5CFF':''}">${e}</div>`).join(''))</script>
  </div>
  <div style="font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:20px 4px 10px">COLOR</div>
  <div class="card row" style="justify-content:space-between;padding:16px 18px">
    <script>document.write(['#7C5CFF','#22B573','#2BB3F3','#3B7BF6','#F5A524','#EC4899','#FF5A3C'].map((c,i)=>`<div style="width:38px;height:38px;border-radius:50%;background:${c};${i===0?'box-shadow:0 0 0 3px #fff,0 0 0 5.5px '+c:''}"></div>`).join(''))</script>
  </div>
  <div style="font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:20px 4px 10px">HOW OFTEN</div>
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <script>document.write(['Daily','Weekdays','3× a week','Custom'].map((t,i)=>`<span class="chip" style="font-size:15px;padding:10px 16px;${i===0?'background:#16151A;color:#fff':'background:#fff;color:var(--fg);box-shadow:inset 0 0 0 1.5px #E4E0E8'}">${t}</span>`).join(''))</script>
  </div>
  <div class="card row" style="margin-top:20px;justify-content:space-between;padding:16px 18px"><div><div style="font-weight:700;font-size:16px">Reminder</div><div class="muted" style="font-size:13px;margin-top:2px">Every day at 21:30</div></div><div style="width:52px;height:32px;border-radius:16px;background:var(--walk);position:relative"><div style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff"></div></div></div>
  <div class="btn" style="margin-top:20px">Create habit</div>
</div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
