<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../_kit/phone.css"><link rel="stylesheet" href="_dayloop.css"><script src="_habits.js"></script>
<body style="position:relative">
<div class="status"></div>
<div class="px" style="margin-top:12px">
  <div class="row" style="justify-content:space-between">
    <div><div class="muted" style="font-size:15px;font-weight:600">Thursday, 21 November</div><div class="h1" style="margin-top:2px">Today</div></div>
    <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FFB199,#FF5A3C)"></div>
  </div>
  <div class="card row" style="margin-top:16px;gap:18px;padding:18px 20px">
    <div style="width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) 0 83%, #FFE5DE 83% 100%);display:flex;align-items:center;justify-content:center;flex:none">
      <div style="width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:-.5px">5/6</div>
    </div>
    <div>
      <div style="font-size:21px;font-weight:800;letter-spacing:-.4px">5 of 6 done</div>
      <div class="muted" style="font-size:15px;margin-top:3px">One more and today is perfect</div>
      <span class="chip" style="margin-top:10px;background:#FFE9E3;color:#E8452A">🔥 32-day streak</span>
    </div>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:16px;padding:0 4px">
    <script>document.write(['M','T','W','T','F','S','S'].map((d,i)=>`<div style="text-align:center"><div class="muted" style="font-size:12px;font-weight:700">${d}</div><div style="width:36px;height:36px;margin-top:6px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;${i<3?'background:var(--accent);color:#fff':i===3?'background:#fff;color:var(--fg);box-shadow:inset 0 0 0 2.5px var(--accent)':'background:#EFECE8;color:#B5B1BB'}">${18+i}</div></div>`).join(''))</script>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:22px"><div class="h2" style="font-size:20px">Habits</div><div style="color:var(--accent);font-weight:700;font-size:15px">+ New</div></div>
  <script>document.write(HABITS.map((h)=>`<div class="card row" style="margin-top:10px;padding:13px 14px;gap:13px">
    <div class="tile" style="background:color-mix(in srgb, ${h.hex} 14%, #fff)">${h.icon}</div>
    <div style="flex:1;min-width:0"><div style="font-size:17px;font-weight:700;letter-spacing:-.2px">${h.name}</div><div class="muted" style="font-size:13px;margin-top:2px">${h.meta} · <span style="color:${h.done?'#E8452A':'var(--muted)'};font-weight:700">🔥 ${h.streak}</span></div></div>
    <div class="check" style="${h.done?`background:${h.hex}`:`box-shadow:inset 0 0 0 2.5px #DAD6DE`}">${h.done?CHECK:''}</div></div>`).join(''))</script>
</div>
<div class="tabbar"><div class="tab on"><i style="border-radius:50%"></i>Today</div><div class="tab"><i></i>Stats</div><div class="tab"><i style="border-radius:4px"></i>Ideas</div><div class="tab"><i style="border-radius:50%"></i>Settings</div></div>
<div class="home-ind"></div>
<script src="../../_kit/statusbar.js"></script>
</body>
