version: 1.8.2+42
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.2.0
  local_auth: ^2.3.0
  purchases_flutter: ^8.1.0
  home_widget: ^0.7.0
  drift: ^2.20.0
  intl: ^0.19.0
flutter_launcher_icons:
  image_path: "assets/icon.png"
